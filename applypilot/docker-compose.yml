services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: applypilot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=:memory:
      - LOG_FORMAT=json
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=*
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - applypilot_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Optional Enterprise Profile (PostgreSQL + Redis + Ollama) ─────────
  postgres:
    profiles: ["enterprise", "full"]
    image: postgres:16-alpine
    container_name: applypilot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=applypilot
      - POSTGRES_USER=applypilot
      - POSTGRES_PASSWORD=applypilot_secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    profiles: ["enterprise", "full"]
    image: redis:7-alpine
    container_name: applypilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    profiles: ["enterprise", "full"]
    image: ollama/ollama:latest
    container_name: applypilot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  applypilot_data:
  pg_data:
  redis_data:
  ollama_models:
